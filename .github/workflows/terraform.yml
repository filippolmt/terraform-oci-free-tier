name: OpenTofu CI

on:
  push:
    branches: [main]
    paths:
      - "*.tf"
      - "tests/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [main]
    paths:
      - "*.tf"
      - "tests/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/terraform.yml"
  schedule:
    - cron: "0 8 * * 1" # Weekly on Monday at 8:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

env:
  OPENTOFU_VERSION: 1.12.6

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}
          tofu_wrapper: false

      - name: Check formatting
        id: fmt
        if: ${{ !cancelled() }}
        run: make fmt-check

      - name: Validate
        id: validate
        if: ${{ !cancelled() }}
        run: make validate

      - name: OpenTofu Test
        id: tofu-test
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: make tofu-test

      - name: Shellcheck
        id: shellcheck
        if: ${{ !cancelled() }}
        run: make shellcheck

      # Fork PRs get a read-only GITHUB_TOKEN: no security-events: write, so the upload would fail.
      - name: Security scan (SARIF)
        if: ${{ !cancelled() && github.event.pull_request.head.repo.fork != true }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "config"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Upload Trivy SARIF
        if: ${{ !cancelled() && github.event.pull_request.head.repo.fork != true }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"
          category: "security-sarif"

      - name: Post results to PR
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        uses: actions/github-script@v9
        with:
          script: |
            const fmt = '${{ steps.fmt.outcome }}';
            const validate = '${{ steps.validate.outcome }}';
            const tofuTest = '${{ steps.tofu-test.outcome }}';
            const shellcheck = '${{ steps.shellcheck.outcome }}';

            const icon = (outcome) => {
              if (outcome === 'success') return '✅ Pass';
              if (outcome === 'skipped') return '⏭️ Skipped';
              return '❌ Fail';
            };

            let body = '## OpenTofu CI Results\n\n';
            body += `| Check | Status |\n`;
            body += `|-------|--------|\n`;
            body += `| Format | ${icon(fmt)} |\n`;
            body += `| Validate | ${icon(validate)} |\n`;
            body += `| OpenTofu Test | ${icon(tofuTest)} |\n`;
            body += `| Shellcheck | ${icon(shellcheck)} |\n`;

            const hints = [];
            if (fmt !== 'success') hints.push('> **Format:** Run `make fmt` to fix formatting issues.');
            if (validate !== 'success' && validate !== 'skipped') hints.push('> **Validate:** Run `make validate` locally to see details.');
            if (tofuTest !== 'success' && tofuTest !== 'skipped') hints.push('> **OpenTofu Test:** Run `make tofu-test` locally to see details.');
            if (shellcheck !== 'success' && shellcheck !== 'skipped') hints.push('> **Shellcheck:** Run `make shellcheck` locally to see details.');
            if (hints.length > 0) body += '\n' + hints.join('\n');

            // Update existing comment or create new one
            const marker = '## OpenTofu CI Results';
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body,
              });
            }
